<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2P 자유게시판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gun/sea.js"></script>
<style>
  :root {
    --bg: #0e0f11; --bg2: #15171a; --bg3: #1c1f24;
    --border: #2a2d33; --accent: #7c6af7; --accent2: #a594f9;
    --text: #e8e9ec; --muted: #6b7280;
    --danger: #f87171; --success: #4ade80; --radius: 10px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.4;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  }
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(14,15,17,0.88); backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px; height: 60px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo { font-family: 'Gowun Dodum', serif; font-size: 18px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
  .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .peer-status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .peer-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
  main { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; position: relative; z-index: 1; }

  /* 신원 */
  .identity-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 14px; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #c084fc); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .identity-info { flex: 1; min-width: 0; }
  .identity-name { font-size: 14px; font-weight: 500; }
  .identity-key { font-size: 11px; color: var(--muted); font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 글쓰기 */
  .write-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 28px; transition: border-color 0.2s; }
  .write-card:focus-within { border-color: var(--accent); }
  .write-input { width: 100%; background: transparent; border: none; color: var(--text); font-family: inherit; font-size: 15px; resize: none; outline: none; min-height: 80px; line-height: 1.6; }
  .write-input::placeholder { color: var(--muted); }

  /* 드롭존 */
  .media-dropzone {
    border: 1.5px dashed var(--border); border-radius: 8px; padding: 18px;
    text-align: center; cursor: pointer; transition: all 0.2s; margin: 12px 0;
    color: var(--muted); font-size: 13px; position: relative;
  }
  .media-dropzone:hover, .media-dropzone.dragover { border-color: var(--accent); background: rgba(124,106,247,0.06); color: var(--accent2); }
  .media-dropzone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .dropzone-icon { font-size: 22px; margin-bottom: 5px; }
  .dropzone-hint { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* 미리보기 */
  .media-preview-area { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .preview-item { position: relative; border-radius: 8px; overflow: hidden; background: var(--bg3); border: 1px solid var(--border); }
  .preview-item img { width: 100px; height: 100px; object-fit: cover; display: block; }
  .preview-item video { width: 160px; height: 100px; object-fit: cover; display: block; }
  .preview-remove { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.7); border: none; color: #fff; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
  .preview-remove:hover { background: var(--danger); }
  .media-type-badge { position: absolute; bottom: 4px; left: 4px; background: rgba(0,0,0,0.7); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; }

  /* 업로드 진행 */
  .upload-progress { font-size: 12px; color: var(--accent2); margin: 8px 0; display: none; align-items: center; gap: 8px; }
  .upload-progress.show { display: flex; }
  .progress-bar-wrap { flex: 1; height: 4px; background: var(--border); border-radius: 2px; }
  .progress-bar { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; width: 0%; }

  .write-divider { height: 1px; background: var(--border); margin: 14px 0; }
  .write-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .write-tools { display: flex; gap: 6px; align-items: center; }
  .tool-btn { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 5px 10px; font-family: inherit; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.15s; }
  .tool-btn:hover { border-color: var(--accent); color: var(--accent2); }
  .char-count { font-size: 12px; color: var(--muted); }

  /* 버튼 */
  .btn { padding: 8px 18px; border-radius: 8px; border: none; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 500; transition: all 0.15s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent2); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* 탭 */
  .sort-tabs { display: flex; gap: 4px; margin-bottom: 16px; }
  .sort-tab { padding: 6px 14px; border-radius: 20px; border: 1px solid transparent; background: transparent; color: var(--muted); font-family: inherit; font-size: 13px; cursor: pointer; transition: all 0.15s; }
  .sort-tab.active { background: var(--bg3); border-color: var(--border); color: var(--text); }

  /* 게시글 카드 */
  .post-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 12px; animation: fadeIn 0.3s ease; transition: border-color 0.2s; }
  .post-card:hover { border-color: #3a3d45; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .post-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
  .post-meta { flex: 1; min-width: 0; }
  .post-author { font-size: 13px; font-weight: 500; }
  .post-time { font-size: 11px; color: var(--muted); }
  .post-body { font-size: 14px; line-height: 1.7; color: var(--text); word-break: break-word; white-space: pre-wrap; margin-bottom: 12px; }

  /* 미디어 그리드 */
  .post-media { margin-bottom: 14px; display: grid; gap: 3px; border-radius: 10px; overflow: hidden; }
  .post-media.c1 { grid-template-columns: 1fr; }
  .post-media.c2 { grid-template-columns: 1fr 1fr; }
  .post-media.c3 { grid-template-columns: 1fr 1fr; }
  .post-media.c3 .mc:first-child { grid-column: 1/-1; }
  .post-media.c4 { grid-template-columns: 1fr 1fr; }
  .mc { position: relative; overflow: hidden; background: var(--bg3); cursor: pointer; }
  .mc img { width: 100%; height: 220px; object-fit: cover; display: block; transition: transform 0.3s; }
  .mc:hover img { transform: scale(1.04); }
  .mc video { width: 100%; max-height: 300px; display: block; background: #000; }
  .post-media.c2 .mc img, .post-media.c4 .mc img { height: 170px; }
  .post-media.c3 .mc:not(:first-child) img { height: 140px; }
  .mc.has-more::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.55); }
  .more-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 22px; font-weight: 700; z-index: 1; }
  .media-loading { color: var(--muted); font-size: 12px; padding: 10px 0; }

  /* 라이트박스 */
  #lightbox { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.93); display: none; align-items: center; justify-content: center; }
  #lightbox.open { display: flex; }
  #lb-content { max-width: 92vw; max-height: 88vh; }
  #lb-content img { max-width: 92vw; max-height: 88vh; object-fit: contain; border-radius: 6px; display: block; }
  #lb-content video { max-width: 92vw; max-height: 88vh; border-radius: 6px; }
  #lb-close { position: fixed; top: 18px; right: 22px; background: rgba(255,255,255,0.12); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 1; }
  #lb-nav { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; }
  .lb-btn { background: rgba(255,255,255,0.15); border: none; color: #fff; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-size: 20px; }
  .lb-btn:hover { background: rgba(255,255,255,0.28); }
  #lb-counter { color: rgba(255,255,255,0.6); font-size: 13px; min-width: 48px; text-align: center; }

  /* 액션 */
  .post-actions { display: flex; gap: 16px; align-items: center; }
  .action-btn { background: none; border: none; color: var(--muted); font-family: inherit; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; padding: 4px 0; transition: color 0.15s; }
  .action-btn:hover { color: var(--text); }
  .action-btn.liked { color: #f472b6; }

  /* 댓글 */
  .comments-section { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); display: none; }
  .comments-section.open { display: block; }
  .comment-item { display: flex; gap: 8px; margin-bottom: 10px; animation: fadeIn 0.2s; }
  .comment-avatar { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; }
  .comment-bubble { background: var(--bg3); border-radius: 8px; padding: 8px 12px; flex: 1; }
  .comment-author { font-size: 11px; font-weight: 500; color: var(--accent2); margin-bottom: 2px; }
  .comment-text { font-size: 13px; color: var(--text); word-break: break-word; white-space: pre-wrap; }
  .comment-input-row { display: flex; gap: 8px; margin-top: 10px; }
  .comment-input { flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; color: var(--text); font-family: inherit; font-size: 13px; outline: none; transition: border-color 0.15s; }
  .comment-input:focus { border-color: var(--accent); }
  .comment-input::placeholder { color: var(--muted); }
  .btn-sm { padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 500; background: var(--accent); color: #fff; white-space: nowrap; }
  .btn-sm:hover { background: var(--accent2); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }
  .loading { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 20px; font-size: 13px; z-index: 10000; transition: transform 0.3s; white-space: nowrap; }
  #toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 480px) {
    header { padding: 0 14px; }
    main { padding: 16px 10px 60px; }
    .post-card { padding: 14px; }
    .write-tools { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-dot"></div>P2P 자유게시판</div>
  <div class="peer-status"><div class="peer-dot"></div><span id="peer-count">연결 중...</span></div>
</header>

<main>
  <div class="identity-card">
    <div class="avatar" id="my-avatar">👤</div>
    <div class="identity-info">
      <div class="identity-name" id="my-name">신원 생성 중...</div>
      <div class="identity-key" id="my-key">공개키를 생성하고 있습니다</div>
    </div>
  </div>

  <div class="write-card">
    <textarea class="write-input" id="post-input" placeholder="자유롭게 글을 남겨보세요... (Ctrl+Enter로 게시)" maxlength="500"></textarea>
    <div class="media-preview-area" id="preview-area"></div>
    <div class="upload-progress" id="upload-progress">
      <span id="upload-label">처리 중...</span>
      <div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    </div>
    <div class="media-dropzone" id="dropzone">
      <input type="file" id="file-input" accept="image/*,video/*" multiple onchange="handleFiles(this.files)">
      <div class="dropzone-icon">📎</div>
      <div>사진·동영상 첨부 (클릭 또는 드래그)</div>
      <div class="dropzone-hint">이미지 최대 5MB · 동영상 최대 30MB · 최대 4개</div>
    </div>
    <div class="write-divider"></div>
    <div class="write-footer">
      <div class="write-tools">
        <button class="tool-btn" onclick="triggerFile()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>사진
        </button>
        <button class="tool-btn" onclick="triggerFile()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>동영상
        </button>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="char-count"><span id="char-current">0</span> / 500</span>
        <button class="btn btn-primary" id="post-btn" onclick="submitPost()">게시하기</button>
      </div>
    </div>
  </div>

  <div class="sort-tabs">
    <button class="sort-tab active" onclick="setSort('new',this)">최신순</button>
    <button class="sort-tab" onclick="setSort('likes',this)">인기순</button>
  </div>

  <div id="posts-container">
    <div class="loading">P2P 네트워크에서 데이터를 불러오는 중...</div>
  </div>
</main>

<!-- 라이트박스 -->
<div id="lightbox" onclick="lbBgClick(event)">
  <div id="lb-content"></div>
  <button id="lb-close" onclick="closeLb()">✕</button>
  <div id="lb-nav">
    <button class="lb-btn" onclick="lbNav(-1)">‹</button>
    <span id="lb-counter"></span>
    <button class="lb-btn" onclick="lbNav(1)">›</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ── GunDB ──────────────────────────────────────────────────────────────
// GunDB 공식 위키(volunteer.dht) 기준 현재 살아있는 릴레이 서버들
const gun = Gun({
  peers: [
    'https://gun.defucc.me/gun',
    'https://gun.o8.is/gun',
    'https://shogun-relay.scobrudot.dev/gun',
    'https://relay.peer.ooo/gun',
  ]
});
const db = gun.get('p2p-board-v2');

// ── 신원 ────────────────────────────────────────────────────────────────
let me = null;
async function initIdentity() {
  // 저장된 신원이 있으면 바로 사용
  const s = localStorage.getItem('p2p-board-id');
  if (s) {
    try {
      me = JSON.parse(s);
      document.getElementById('my-avatar').textContent = me.emoji;
      document.getElementById('my-name').textContent = me.alias;
      document.getElementById('my-key').textContent = '공개키: ' + me.pub.slice(0,32) + '...';
      return;
    } catch(e) {
      localStorage.removeItem('p2p-board-id');
    }
  }

  // 새 신원 생성 — SEA.pair()가 느린 안드로이드를 위해 타임아웃 처리
  try {
    const p = await Promise.race([
      SEA.pair(),
      new Promise((_,rej) => setTimeout(() => rej(new Error('timeout')), 5000))
    ]);
    me = { pub: p.pub, priv: p.priv, alias: '익명' + p.pub.slice(0,4), emoji: pickEmoji(p.pub) };
    localStorage.setItem('p2p-board-id', JSON.stringify(me));
  } catch(e) {
    // SEA 실패 시 랜덤 ID로 대체
    const rnd = Math.random().toString(36).slice(2, 10);
    me = { pub: rnd, priv: '', alias: '익명' + rnd.slice(0,4), emoji: pickEmoji(rnd) };
    localStorage.setItem('p2p-board-id', JSON.stringify(me));
  }

  document.getElementById('my-avatar').textContent = me.emoji;
  document.getElementById('my-name').textContent = me.alias;
  document.getElementById('my-key').textContent = '공개키: ' + me.pub.slice(0,32) + '...';
}
const EMOJIS = ['🦊','🐻','🐼','🦁','🐯','🦅','🦋','🌊','🌙','⭐','🔥','🌿','🎵','🎮','🌸'];
function pickEmoji(pub) { return EMOJIS[pub.charCodeAt(0) % EMOJIS.length]; }
const GRADS = ['linear-gradient(135deg,#7c6af7,#a594f9)','linear-gradient(135deg,#f472b6,#fb7185)','linear-gradient(135deg,#34d399,#6ee7b7)','linear-gradient(135deg,#fbbf24,#f59e0b)','linear-gradient(135deg,#60a5fa,#818cf8)','linear-gradient(135deg,#f87171,#fb923c)'];
function avaColor(pub) { return GRADS[(pub||'a').charCodeAt(0) % GRADS.length]; }

// ── 미디어 처리 ─────────────────────────────────────────────────────────
let pending = []; // {dataUrl, type}
const IMG_MAX = 5*1024*1024, VID_MAX = 30*1024*1024, MAX_N = 4;

async function handleFiles(files) {
  if (!files || !files.length) return;
  const rem = MAX_N - pending.length;
  if (rem <= 0) { showToast('⚠ 최대 4개까지 첨부 가능합니다'); return; }
  for (const f of Array.from(files).slice(0, rem)) {
    const isImg = f.type.startsWith('image/'), isVid = f.type.startsWith('video/');
    if (!isImg && !isVid) { showToast('⚠ 이미지/동영상만 가능합니다'); continue; }
    if (isImg && f.size > IMG_MAX) { showToast('⚠ 이미지는 5MB 이하만 가능합니다'); continue; }
    if (isVid && f.size > VID_MAX) { showToast('⚠ 동영상은 30MB 이하만 가능합니다'); continue; }
    setProgress(true, isImg ? '이미지 압축 중...' : '동영상 준비 중...', 30);
    try {
      const dataUrl = isImg ? await compressImg(f) : await readFile(f);
      pending.push({ dataUrl, type: isImg ? 'image' : 'video' });
      setProgress(true, '완료', 100);
    } catch(e) { showToast('⚠ 파일 처리 실패'); }
  }
  setTimeout(() => setProgress(false), 500);
  renderPreview();
  document.getElementById('file-input').value = '';
}

function readFile(f) {
  return new Promise((res,rej) => { const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=rej; r.readAsDataURL(f); });
}

function compressImg(f) {
  return new Promise((res,rej) => {
    const r = new FileReader();
    r.onload = e => {
      const img = new Image();
      img.onload = () => {
        let {width:w, height:h} = img;
        const MAX = 1280;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h*MAX/w); w = MAX; }
          else { w = Math.round(w*MAX/h); h = MAX; }
        }
        const c = document.createElement('canvas');
        c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror=rej; img.src=e.target.result;
    };
    r.onerror=rej; r.readAsDataURL(f);
  });
}

function setProgress(show, label='', pct=0) {
  const el = document.getElementById('upload-progress');
  el.classList.toggle('show', show);
  if (show) { document.getElementById('upload-label').textContent=label; document.getElementById('progress-bar').style.width=pct+'%'; }
}

function renderPreview() {
  const area = document.getElementById('preview-area');
  const dz = document.getElementById('dropzone');
  if (!pending.length) { area.innerHTML=''; dz.style.display=''; return; }
  dz.style.display = pending.length >= MAX_N ? 'none' : '';
  area.innerHTML = pending.map((m,i) => `
    <div class="preview-item">
      ${m.type==='image' ? `<img src="${m.dataUrl}" alt="">` : `<video src="${m.dataUrl}" muted></video>`}
      <div class="media-type-badge">${m.type==='image'?'📷':'🎬'}</div>
      <button class="preview-remove" onclick="removeMedia(${i})">✕</button>
    </div>`).join('');
}
function removeMedia(i) { pending.splice(i,1); renderPreview(); }
function triggerFile() { document.getElementById('file-input').click(); }

// 드래그앤드롭
const dzEl = document.getElementById('dropzone');
dzEl.addEventListener('dragover', e => { e.preventDefault(); dzEl.classList.add('dragover'); });
dzEl.addEventListener('dragleave', () => dzEl.classList.remove('dragover'));
dzEl.addEventListener('drop', e => { e.preventDefault(); dzEl.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });

// 클립보드 붙여넣기
document.addEventListener('paste', e => {
  const files = Array.from(e.clipboardData?.items||[]).filter(i=>i.kind==='file'&&(i.type.startsWith('image/')||i.type.startsWith('video/'))).map(i=>i.getAsFile());
  if (files.length) handleFiles(files);
});

// ── 청크 저장/로드 ──────────────────────────────────────────────────────
const CHUNK = 150000;

async function saveMediaChunked(postId, idx, dataUrl, type) {
  const node = db.get('media_'+postId+'_'+idx);
  const n = Math.ceil(dataUrl.length / CHUNK);
  node.get('meta').put(JSON.stringify({type, chunks:n}));
  for (let c=0; c<n; c++) {
    node.get('c'+c).put(dataUrl.slice(c*CHUNK, (c+1)*CHUNK));
    await new Promise(r=>setTimeout(r,25));
  }
}

function loadMediaChunked(postId, idx) {
  return new Promise(resolve => {
    const node = db.get('media_'+postId+'_'+idx);
    node.get('meta').once(metaStr => {
      if (!metaStr) { resolve(null); return; }
      let meta;
      try { meta = JSON.parse(metaStr); } catch { resolve(null); return; }
      const {type, chunks} = meta;
      const parts = new Array(chunks).fill(null);
      let got = 0;
      for (let c=0; c<chunks; c++) {
        ((ci) => node.get('c'+ci).once(d => {
          parts[ci] = d||''; got++;
          if (got===chunks) resolve({dataUrl:parts.join(''), type});
        }))(c);
      }
      setTimeout(() => { if (got<chunks) resolve(null); }, 5000);
    });
  });
}

// ── 좋아요 ─────────────────────────────────────────────────────────────
let liked = new Set(JSON.parse(localStorage.getItem('liked')||'[]'));
function saveLiked() { localStorage.setItem('liked', JSON.stringify([...liked])); }

// ── 게시글 ──────────────────────────────────────────────────────────────
let posts = {}, sortMode = 'new';

function setSort(mode, el) {
  sortMode=mode;
  document.querySelectorAll('.sort-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderPosts();
}

function subscribeToDb() {
  const statusEl = document.getElementById('peer-count');
  const dotEl = document.querySelector('.peer-dot');
  let connectedPeers = 0;

  const failTimer = setTimeout(() => {
    if (connectedPeers === 0) {
      statusEl.textContent = '연결 실패';
      dotEl.style.background = 'var(--danger)';
    }
  }, 6000);

  gun.on('hi', () => {
    connectedPeers++;
    clearTimeout(failTimer);
    statusEl.textContent = 'P2P 연결됨';
    dotEl.style.background = 'var(--success)';
  });

  gun.on('bye', () => {
    connectedPeers = Math.max(0, connectedPeers - 1);
    if (connectedPeers === 0) {
      statusEl.textContent = '재연결 중...';
      dotEl.style.background = '#fbbf24';
    }
  });

  db.map().on((data,id) => {
    if (!data||!data.author) return;
    if (id.startsWith('comment_')||id.startsWith('media_')) return;
    if (!posts[id]) posts[id]={id,likes:0,comments:{},time:data.time};
    Object.assign(posts[id], data);
    renderPosts();
  });
}

async function submitPost() {
  const inp = document.getElementById('post-input');
  const content = inp.value.trim();
  if (!content && !pending.length) { showToast('⚠ 내용이나 미디어를 입력해주세요'); return; }

  const btn = document.getElementById('post-btn');
  btn.disabled=true; btn.textContent='게시 중...';

  const id = 'post_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);

  if (pending.length) {
    setProgress(true,'미디어 업로드 중...',10);
    for (let i=0;i<pending.length;i++) {
      setProgress(true,`미디어 업로드 중... (${i+1}/${pending.length})`, 10+(i+1)/pending.length*80);
      await saveMediaChunked(id, i, pending[i].dataUrl, pending[i].type);
    }
    setProgress(true,'완료',100);
    setTimeout(()=>setProgress(false),600);
  }

  db.get(id).put({ id, content, author:me.alias, authorPub:me.pub, emoji:me.emoji, time:Date.now(), likes:0, mediaCount:pending.length });

  inp.value=''; document.getElementById('char-current').textContent='0';
  pending=[]; renderPreview();
  btn.disabled=false; btn.textContent='게시하기';
  showToast('✓ 게시되었습니다');
}

function toggleLike(postId) {
  const p=posts[postId]; if(!p) return;
  if (liked.has(postId)) { liked.delete(postId); p.likes=Math.max(0,(p.likes||0)-1); }
  else { liked.add(postId); p.likes=(p.likes||0)+1; }
  saveLiked(); db.get(postId).get('likes').put(p.likes); renderPosts();
}

function toggleComments(postId) {
  const s=document.getElementById('cs-'+postId); if(!s) return;
  s.classList.toggle('open');
  if (s.classList.contains('open') && !s.dataset.sub) {
    s.dataset.sub='1';
    db.get('comment_'+postId).map().on((data,id)=>{
      if(!data||!data.text) return;
      if(!posts[postId]) return;
      posts[postId].comments = posts[postId].comments||{};
      posts[postId].comments[id]=data;
      renderComments(postId);
    });
  }
}

function renderComments(postId) {
  const el=document.getElementById('clist-'+postId); if(!el) return;
  const list=Object.values(posts[postId]?.comments||{}).sort((a,b)=>a.time-b.time);
  if (!list.length) { el.innerHTML='<div style="color:var(--muted);font-size:12px;padding:4px 0">아직 댓글이 없습니다</div>'; return; }
  el.innerHTML=list.map(c=>`
    <div class="comment-item">
      <div class="comment-avatar" style="background:${avaColor(c.authorPub)}">${c.emoji||'💬'}</div>
      <div class="comment-bubble">
        <div class="comment-author">${esc(c.author)}</div>
        <div class="comment-text">${esc(c.text)}</div>
      </div>
    </div>`).join('');
}

async function submitComment(postId) {
  const inp=document.getElementById('ci-'+postId);
  const text=inp.value.trim(); if(!text) return;
  db.get('comment_'+postId).get('c_'+Date.now()).put({text,author:me.alias,authorPub:me.pub,emoji:me.emoji,time:Date.now()});
  inp.value=''; showToast('💬 댓글 등록됨');
}

// ── 렌더링 ──────────────────────────────────────────────────────────────
const mediaCache={};

function renderPosts() {
  const container=document.getElementById('posts-container');
  let list=Object.values(posts);
  if (!list.length) {
    container.innerHTML='<div class="empty-state"><div class="empty-icon">📭</div><div>첫 번째 글을 남겨보세요!</div></div>';
    return;
  }
  list.sort(sortMode==='new' ? (a,b)=>(b.time||0)-(a.time||0) : (a,b)=>(b.likes||0)-(a.likes||0));

  container.innerHTML = list.map(post => {
    const isLiked=liked.has(post.id);
    const cc=Object.keys(post.comments||{}).length;
    const mc=post.mediaCount||0;

    let mediaHtml='';
    if (mc>0) {
      const cached=mediaCache[post.id];
      if (cached) { mediaHtml=buildGrid(post.id,cached); }
      else if (!mediaCache[post.id+'_l']) {
        mediaCache[post.id+'_l']=true;
        loadPostMedia(post.id,mc).then(items=>{
          mediaCache[post.id]=items;
          delete mediaCache[post.id+'_l'];
          const el=document.getElementById('pmedia-'+post.id);
          if (el&&items.length) el.outerHTML=buildGrid(post.id,items);
        });
        mediaHtml=`<div id="pmedia-${post.id}" class="media-loading">미디어 불러오는 중... 📎${mc>1?` ×${mc}`:''}</div>`;
      } else {
        mediaHtml=`<div id="pmedia-${post.id}" class="media-loading">미디어 불러오는 중...</div>`;
      }
    }

    return `
      <div class="post-card">
        <div class="post-header">
          <div class="post-avatar" style="background:${avaColor(post.authorPub)}">${esc(post.emoji||'👤')}</div>
          <div class="post-meta">
            <div class="post-author">${esc(post.author)}</div>
            <div class="post-time">${fmtTime(post.time)}</div>
          </div>
        </div>
        ${post.content?`<div class="post-body">${esc(post.content)}</div>`:''}
        ${mediaHtml}
        <div class="post-actions">
          <button class="action-btn${isLiked?' liked':''}" onclick="toggleLike('${post.id}')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="${isLiked?'#f472b6':'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            ${post.likes||0}
          </button>
          <button class="action-btn" onclick="toggleComments('${post.id}')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            댓글${cc>0?' '+cc:''}
          </button>
        </div>
        <div class="comments-section" id="cs-${post.id}">
          <div id="clist-${post.id}"><div style="color:var(--muted);font-size:12px;padding:4px 0">아직 댓글이 없습니다</div></div>
          <div class="comment-input-row">
            <input class="comment-input" id="ci-${post.id}" placeholder="댓글 입력..."
              onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submitComment('${post.id}')}"/>
            <button class="btn-sm" onclick="submitComment('${post.id}')">등록</button>
          </div>
        </div>
      </div>`;
  }).join('');
}

async function loadPostMedia(postId,count) {
  const res=[];
  for(let i=0;i<count;i++){const m=await loadMediaChunked(postId,i);if(m)res.push(m);}
  return res;
}

function buildGrid(postId, items) {
  const n=Math.min(items.length,4), extra=items.length-4;
  const cls='c'+n;
  const cells=items.slice(0,n).map((m,i)=>{
    const showMore=i===n-1&&extra>0;
    if(m.type==='video') {
      return `<div class="mc" onclick="openLb('${postId}',${i})"><video src="${m.dataUrl}" muted playsinline preload="metadata"></video>${showMore?`<div class="more-label">+${extra+1}</div>`:''}</div>`;
    }
    return `<div class="mc${showMore?' has-more':''}" onclick="openLb('${postId}',${i})"><img src="${m.dataUrl}" alt="" loading="lazy">${showMore?`<div class="more-label">+${extra+1}</div>`:''}</div>`;
  }).join('');
  return `<div id="pmedia-${postId}" class="post-media ${cls}">${cells}</div>`;
}

// ── 라이트박스 ──────────────────────────────────────────────────────────
let lbItems=[], lbIdx=0;

function openLb(postId,idx){
  const items=mediaCache[postId]; if(!items) return;
  lbItems=items; lbIdx=idx; renderLb();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow='hidden';
}
function renderLb(){
  const m=lbItems[lbIdx];
  document.getElementById('lb-nav').style.display=lbItems.length>1?'flex':'none';
  document.getElementById('lb-counter').textContent=lbItems.length>1?`${lbIdx+1} / ${lbItems.length}`:'';
  document.getElementById('lb-content').innerHTML=m.type==='image'
    ?`<img src="${m.dataUrl}" alt="">`
    :`<video src="${m.dataUrl}" controls autoplay style="max-width:92vw;max-height:88vh;border-radius:6px"></video>`;
}
function lbNav(d){ lbIdx=(lbIdx+d+lbItems.length)%lbItems.length; renderLb(); }
function closeLb(){ document.getElementById('lightbox').classList.remove('open'); document.body.style.overflow=''; document.getElementById('lb-content').innerHTML=''; }
function lbBgClick(e){ if(e.target===document.getElementById('lightbox')) closeLb(); }
document.addEventListener('keydown',e=>{
  const lb=document.getElementById('lightbox');
  if(!lb.classList.contains('open')) return;
  if(e.key==='Escape') closeLb();
  if(e.key==='ArrowLeft') lbNav(-1);
  if(e.key==='ArrowRight') lbNav(1);
});

// ── 유틸 ───────────────────────────────────────────────────────────────
function esc(s){ if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtTime(ts){ if(!ts) return ''; const d=Date.now()-ts; if(d<60000) return '방금 전'; if(d<3600000) return Math.floor(d/60000)+'분 전'; if(d<86400000) return Math.floor(d/3600000)+'시간 전'; return new Date(ts).toLocaleDateString('ko-KR'); }
let toastT;
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400); }

document.getElementById('post-input').addEventListener('input',function(){ document.getElementById('char-current').textContent=this.value.length; });
document.getElementById('post-input').addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='Enter') submitPost(); });

(async()=>{ await initIdentity(); subscribeToDb(); })();
</script>
